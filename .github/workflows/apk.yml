# Compila el APK de Gymori en GitHub y lo publica en Releases (descarga directa, sin cuenta).
# Corre cuando cambia la app (android/ o web/public/) o a mano desde la pestaña Actions.
name: APK de Gymori

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - 'web/public/**'
      - '.github/workflows/apk.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Compilar APK
        working-directory: android
        run: ./gradlew --no-daemon assembleDebug

      - name: Publicar en Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=$(grep -oP 'versionName = "\K[^"]+' android/app/build.gradle.kts)
          apk="Gymori-$v.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$apk"
          tag="v$v"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" "$apk" --clobber
          else
            gh release create "$tag" "$apk" --title "Gymori $v" --notes "APK de Gymori $v. Se instala encima de la versión anterior." --target "$GITHUB_SHA"
          fi
